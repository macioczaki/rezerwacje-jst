name: e2e

on:
  push:
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/e2e.yml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"

jobs:
  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rezerwacje
          POSTGRES_PASSWORD: rezerwacje
          POSTGRES_DB: rezerwacje
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rezerwacje"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=localhost;Port=5432;Database=rezerwacje;Username=rezerwacje;Password=rezerwacje"

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 8.0.10

      - name: Restore backend
        run: dotnet restore backend/Rezerwacje.sln

      - name: Build backend
        run: dotnet build backend/Rezerwacje.sln --no-restore -c Debug

      - name: Apply migrations
        env:
          PATH: ${{ env.PATH }}:/home/runner/.dotnet/tools
        run: |
          cd backend
          dotnet ef database update \
            --project src/Rezerwacje.Infrastructure \
            --startup-project src/Rezerwacje.Api

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: frontend
        env:
          CI: "true"
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload test results (screenshots on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/test-results/
          retention-days: 7