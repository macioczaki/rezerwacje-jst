name: backend

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore Rezerwacje.sln

      - name: Build
        run: dotnet build Rezerwacje.sln --no-restore -c Release

      - name: Test
        run: dotnet test Rezerwacje.sln --no-build -c Release --verbosity normal